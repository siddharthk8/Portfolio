		<!-- Structured Data -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "ProfilePage",
						"@id": "https://siddharthkr.com/#profile",
						"url": "https://siddharthkr.com/",
						"name": "Siddharth Kumar — Software Engineer",
						"description": "Portfolio of Siddharth Kumar, a software engineer focused on full-stack development, backend systems, cloud applications, and practical AI/ML.",
						"mainEntity": {
							"@id": "https://siddharthkr.com/#person"
						}
					},
					{
						"@type": "Person",
						"@id": "https://siddharthkr.com/#person",
						"name": "Siddharth Kumar",
						"url": "https://siddharthkr.com/",
						"jobTitle": "Software Engineer",
						"description": "Software engineer focused on full-stack development, backend systems, cloud applications, and practical AI/ML.",
						"image": "https://siddharthkr.com/web-app-manifest-512x512.png",
						"sameAs": [
							"https://github.com/siddharthk8",
							"https://www.linkedin.com/in/siddharth-kumar-profile"
						],
						"knowsAbout": [
							"Software Engineering",
							"Full-Stack Development",
							"Backend Development",
							"System Design",
							"REST APIs",
							"Python",
							"Java",
							"JavaScript",
							"React",
							"Django",
							"Django REST Framework",
							"FastAPI",
							"SQL",
							"SQLAlchemy",
							"Amazon Web Services",
							"Amazon EC2",
							"Amazon S3",
							"AWS Bedrock",
							"Artificial Intelligence",
							"Large Language Models",
							"Retrieval-Augmented Generation"
						]
					},
					{
						"@type": "WebSite",
						"@id": "https://siddharthkr.com/#website",
						"url": "https://siddharthkr.com/",
						"name": "Siddharth Kumar — Software Engineer",
						"description": "Personal portfolio of Siddharth Kumar showcasing software engineering projects, experience, skills, and technical work.",
						"publisher": {
							"@id": "https://siddharthkr.com/#person"
						}
					}
				]
			}
		</script>

		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Siddharth Kumar" />
		<link rel="manifest" href="/site.webmanifest" />

		<script>
			(function () {
				// TailwindCSS suggestion to avoid FOUC(Flash Of Unstyled Content)
				const theme = localStorage.theme;
				const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

				// (theme === "system" && prefersDark) is important below.
				// since we are storing "system" in localStorage.
				if (
					theme === "dark" ||
					(theme === "system" && prefersDark) ||
					(!theme && prefersDark)
				) {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
